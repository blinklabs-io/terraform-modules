name: Release Modules

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # Full history needed for changelog generation

      - uses: techpivot/terraform-module-releaser@b5df513373777916d19dd842bf0b2b7461e7cf8f  # v2.2.1
        with:
          major-keywords: 'BREAKING CHANGE,breaking change,!:'
          minor-keywords: 'feat,feature'
          patch-keywords: 'fix,chore,docs,refactor,perf'
          default-first-tag: 'v0.1.0'
          disable-wiki: true
